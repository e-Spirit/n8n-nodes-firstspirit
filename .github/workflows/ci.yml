# Runs lint, tests and build on every push to main and on every pull request,
# so a broken change is caught before it can be released.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The dev toolchain (isolated-vm via @n8n/node-cli) does not compile on Node 20; 22 is what the release uses.
        node-version: ['22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
